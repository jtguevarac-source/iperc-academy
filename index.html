function start(){document.querySelector('header').style.display='';go('m0')}

/* PANEL */
function f0(){V.innerHTML=`${need?'<div class=why>⚠️ Primero elige un rubro para empezar.</div>':''}<div class=card><b>Claves rápidas</b><p class=m>Peligro = fuente de daño. Riesgo = Probabilidad × Severidad (1–25): 1–5 aceptable, 6–10 moderado, 11–15 importante, 16–25 intolerable. Jerarquía de controles: 1 Eliminación → 2 Sustitución → 3 Ingeniería → 4 Administrativos → 5 EPP.</p><p class=m>Rangos: 300 Operario capacitado · 600 Supervisor · 850 Experto SSOMA.</p>
<div class=row><input type=text id=nm placeholder="Tu nombre" value="${S.name}"><button class=p onclick="share(this)">Copiar mi resultado</button><button onclick="reset(this)">Reiniciar todo</button><button onclick="portada()">Ver portada</button></div></div>
<div class=card><h2>Paso 1: elige tu rubro</h2><p class=m>Cada rubro tiene sus propios ejercicios y su propio puntaje (1000 pts).</p><div class=row>${Object.keys(D).map(k=>`<button class="rb ${S.r==k?'p':''}" onclick="pick('${k}')">${D[k][0]}<br><span class=m>${tot(k)} / 1000</span></button>`).join('')}</div></div>
${S.r?`<div class=card><h2>${D[S.r][0]}: tu avance</h2>${how('Usa los botones azules de arriba, en orden del ① al ⑤. Puedes repetir cada etapa para mejorar tu puntaje.')}${Object.keys(MAX).map(k=>`<div style="margin:10px 0"><div class=row style="justify-content:space-between"><b>${NAMES[k]}</b><span class=sc>${S.sc[S.r][k]} / ${MAX[k]}</span></div><div class=bar><i style="width:${S.sc[S.r][k]/MAX[k]*100}%"></i></div></div>`).join('')}</div>`:''}`;
need=0;$('#nm').onchange=e=>{S.name=e.target.value.slice(0,40);persist()}}
function share(b){const t=`Simulador IPERC 🇵🇪 — ${S.name||'Participante'}: ${S.r?D[S.r][0]+' ':''}${tot()}/1000 (${rank(tot())})`;
try{navigator.clipboard.writeText(t).then(()=>b.textContent='¡Copiado!')}catch(e){b.textContent=t}}
function reset(b){if(!armed){armed=1;b.textContent='¿Seguro? Pulsa otra vez';return}
armed=0;S={name:S.name,r:'',sc:{c:E(),k:E(),m:E()}};persist();head();f0()}

/* 1 CLASIFICA */
function f1(){let i=0,p=0;const C=['Peligro','Riesgo','Control'],L=R()[1],x=X[S.r];
(function show(){if(i>=L.length){best('m1',p);return V.innerHTML=end(p,150,'m1')}
const [t,k]=L[i].split('|');
V.innerHTML=`${how('Decide si cada ítem es un <b>Peligro</b> (fuente o condición que puede dañar), un <b>Riesgo</b> (el daño que podría ocurrir) o un <b>Control</b> (medida para reducirlo). Cada acierto vale 15 pts y después verás el porqué.')}<div class=card><div class=m>Ítem ${i+1}/${L.length} · Puntos: <span class=sc>${p}</span></div><h2>“${t}”</h2><p class=m>¿Qué es?</p><div class=row>${C.map((c,j)=>`<button class=opt2 data-k=${j}>${c}</button>`).join('')}</div><div id=fb></div></div>`;
V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k==+k;if(ok)p+=15;
V.querySelectorAll('[data-k]').forEach(y=>{y.disabled=1;if(+y.dataset.k==+k)y.classList.add('ok')});if(!ok)b.classList.add('no');
$('#fb').innerHTML=`<p>${ok?'✅ ¡Correcto! +15':'❌ Era: <b>'+C[k]+'</b>'}</p>${why(x.a[i])}<button class=p id=nx>Siguiente</button>`;$('#nx').onclick=()=>{i++;show()}})})()}

/* 2 MATRIZ */
function f2(){let i=0,t=0;const L=R()[2],x=X[S.r];
(function show(){if(i>=L.length){best('m2',t);return V.innerHTML=end(t,300,'m2')}
const s=L[i],cs=s[3].map(y=>{const a=y.split('|');return [a[0],+a[1]]}),sel=n=>`<select id=${n}>${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select>`;
V.innerHTML=`${how('Para cada escenario: <b>1)</b> estima Probabilidad y Severidad (1 a 5). <b>2)</b> Marca los controles que aplicarías. Puntos: estimación hasta 40, controles hasta 40 y usar eliminación, sustitución o ingeniería sin errores 20. Después verás el porqué de cada control.')}<div class=card><div class=m>Escenario ${i+1}/3 · Puntos: <span class=sc>${t}</span> · máx. 100 por escenario</div><h2>${s[0]}</h2>
<p><b>Paso 1 · Evalúa el riesgo inicial:</b> Probabilidad ${sel('sp')} Severidad ${sel('ss')}</p>
<p><b>Paso 2 · Elige los controles que aplicarías:</b></p>${cs.map((c,k)=>`<label class=l><input type=checkbox value=${k}> ${c[0]}</label>`).join('')}<button class=p id=ev>Evaluar</button><div id=fb></div></div>`;
$('#ev').onclick=()=>{const p=+$('#sp').value,q=+$('#ss').value,ch=[...V.querySelectorAll('input:checked')].map(y=>cs[y.value]);
const a=d=>d==0?20:d==1?10:0,pa=a(Math.abs(p-s[1])),sa=a(Math.abs(q-s[2]));
let cp=0,bad=0,hi=0,v=0;ch.forEach(c=>{if(c[1]){cp+=W[c[1]];v++;if(c[1]<=3)hi=1}else bad++});
cp=Math.max(0,Math.min(40,cp-10*bad));const hb=hi&&!bad?20:0,pts=pa+sa+cp+hb;t+=pts;
const rp=Math.max(1,s[1]-v),rs=Math.max(1,s[2]-(hi?1:0));
const list=cs.map(c=>{const on=ch.includes(c);return `<div class=m>${on?(c[1]?'✅':'❌'):(c[1]?'⚪':'▫️')} <b>${c[0]}</b>: ${LR[c[1]]}${!on&&c[1]?' <i>(no la marcaste)</i>':''}</div>`}).join('');
V.querySelectorAll('input').forEach(y=>y.disabled=1);$('#ev').remove();
$('#fb').innerHTML=`<p>Experto: P=${s[1]}, S=${s[2]} → riesgo ${s[1]*s[2]} (${lvl(s[1]*s[2])}). Tú: P=${p}, S=${q}. <b>+${pa+sa}</b></p>${why(x.b[i])}
<p><b>Revisión de controles</b> (✅ marcado y válido · ❌ marcado e inválido · ⚪ válido que no marcaste):</p>${list}
<p>Controles: <b>+${cp}</b>${bad?` (${bad} inválido${bad>1?'s':''}: −${10*bad})`:''} · Jerarquía (eliminación, sustitución o ingeniería sin errores): <b>+${hb}</b></p>
<p>Riesgo residual estimado: ${rp*rs} (${lvl(rp*rs)}). <span class=sc>Total del escenario: ${pts}/100</span></p><button class=p id=nx>Siguiente</button>`;$('#nx').onclick=()=>{i++;show()}}})()}

/* 3 EVALÚA */
function f3(){let i=0,t=0;const L=R()[3],x=X[S.r];
(function show(){if(i>=L.length){best('m3',t);return V.innerHTML=end(t,150,'m3')}
const r=L[i];V.innerHTML=`${how('Mueve los deslizadores para estimar la <b>Probabilidad</b> (qué tan seguido ocurre) y la <b>Severidad</b> (qué tan grave sería el daño). Cada punto de diferencia con el experto resta 6 pts (máximo 25 por ronda).')}<div class=card><div class=m>Ronda ${i+1}/${L.length} · Puntos: <span class=sc>${t}</span></div><h2>${r[0]}</h2>
<p>Probabilidad: <b id=vp>3</b> <span class=m>(1 raro … 5 casi a diario)</span><input type=range id=rp min=1 max=5 value=3 style="width:100%"></p>
<p>Severidad: <b id=vs>3</b> <span class=m>(1 sin lesión … 5 muerte/incapacidad total)</span><input type=range id=rs min=1 max=5 value=3 style="width:100%"></p>
<p class=sc id=lv></p><button class=p id=ev>Confirmar (25 pts)</button><div id=fb></div></div>`;
const up=()=>{const p=+$('#rp').value,s=+$('#rs').value;$('#vp').textContent=p;$('#vs').textContent=s;$('#lv').textContent=`Tu riesgo: ${p*s} (${lvl(p*s)})`};
$('#rp').oninput=up;$('#rs').oninput=up;up();
$('#ev').onclick=()=>{const p=+$('#rp').value,s=+$('#rs').value,d=Math.abs(p-r[1])+Math.abs(s-r[2]),pts=Math.max(0,25-6*d);t+=pts;
$('#rp').disabled=$('#rs').disabled=1;$('#ev').remove();
$('#fb').innerHTML=`<p>Experto: P=${r[1]}, S=${r[2]} → ${r[1]*r[2]} (${lvl(r[1]*r[2])}). Tú: ${p*s} (${lvl(p*s)}). <b>+${pts} pts</b></p>${why(x.t[i])}<button class=p id=nx>Siguiente</button>`;$('#nx').onclick=()=>{i++;show()}}})()}

/* 4 CASOS */
function f4(){let i=0,t=0;const L=R()[4];
(function show(){if(i>=L.length){best('m4',t);return V.innerHTML=end(t,200,'m4')}
const c=L[i],o=[[c[1],25],[c[2],8],[c[3],0]].sort(()=>Math.random()-.5);
V.innerHTML=`${how('Lee la situación y elige qué harías. Mejor opción: 25 pts · opción aceptable pero incompleta: 8 pts · incorrecta: 0 pts.')}<div class=card><div class=m>Caso ${i+1}/${L.length} · Puntos: <span class=sc>${t}</span></div><h2>${c[0]}</h2>${o.map((x,k)=>`<button class=opt data-k=${k}>${x[0]}</button>`).join('')}<div id=fb></div></div>`;
V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const x=o[+b.dataset.k];t+=x[1];
V.querySelectorAll('[data-k]').forEach((y,k)=>{y.disabled=1;if(o[k][1]==25)y.classList.add('ok')});if(x[1]<25)b.classList.add('no');
$('#fb').innerHTML=`<p>${x[1]==25?'✅ ¡Mejor opción!':x[1]?'⚠️ Aceptable, pero no es la mejor':'❌ Incorrecta'} <b>+${x[1]} pts.</b></p>${x[1]<25?`<p>La mejor era: <b>${c[1]}</b></p>`:''}${why(c[4])}<button class=p id=nx>Siguiente</button>`;$('#nx').onclick=()=>{i++;show()}})})()}

/* 5 INSPECCIÓN */
function f5(){const L=R()[5],a=Array(L.length).fill(-1),x=X[S.r];
V.innerHTML=`${how('Revisa cada situación de la escena y marca <b>⚠ Peligro</b> o <b>✔ Conforme</b>. Cada acierto vale 20 pts. Al terminar verás el porqué de cada una.')}<div class=card><h2>${R()[0]}: inspección</h2>${L.map((d,k)=>`<div class=card style="margin:8px 0" id=r${k}><div>${d.split('|')[0]}</div><div class=row style="margin-top:6px"><button data-k=${k} data-v=1>⚠ Peligro</button><button data-k=${k} data-v=0>✔ Conforme</button></div></div>`).join('')}<button class=p id=fin>Terminar inspección</button><div id=fb></div></div>`;
V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;a[k]=+b.dataset.v;document.querySelectorAll(`#r${k} button`).forEach(y=>y.classList.toggle('p',y==b))});
$('#fin').onclick=()=>{if(a.includes(-1))return $('#fb').textContent='Faltan situaciones por marcar.';let t=0;
L.forEach((d,k)=>{const h=+d.split('|')[1],ok=a[k]==h;if(ok)t+=20;$('#r'+k).classList.add(ok?'ok':'no');$('#r'+k).insertAdjacentHTML('beforeend',`<div class=m>${ok?'✅':'❌'} ${h?'Era un peligro':'Estaba conforme'}. 💡 ${x.i[k]}</div>`)});
$('#fin').remove();best('m5',t);$('#fb').innerHTML=end(t,200,'m5')}}

const F=[f0,f1,f2,f3,f4,f5];
$('nav').innerHTML=Object.keys(NAMES).map(k=>`<button data-m=${k} onclick="go('${k}')">${NAMES[k]}</button>`).join('');
head();portada();
</script></body></html>
